# Configuracao usada pelo docker-compose (o script iniciar-rabbitmq.ps1 gera a versao Windows).
# Carrega exchanges, filas e vinculos de definitions.json na inicializacao do broker.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
loopback_users = none
# Painel atualiza contadores das filas a cada 1 s (padrao 5 s) - melhor para a demonstracao.
collect_statistics_interval = 1000
